name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Resolve Maven dependencies
        run: mvn -B dependency:resolve -Dmaven.repo.local=$HOME/.m2

      - name: Run Maven checkstyle check
        run: mvn -B checkstyle:check -Dmaven.repo.local=$HOME/.m2

      - name: Run Maven tests
        run: mvn -B test -Dmaven.repo.local=$HOME/.m2

      - name: Run Maven JaCoCo check
        run: mvn -B jacoco:check -Dmaven.repo.local=$HOME/.m2

      - name: Run Maven dependency vulnerability check
        run: mvn -B org.owasp:dependency-check-maven:check -Dmaven.repo.local=$HOME/.m2

      - name: npm install
        run: npm ci

      - name: Run npm lint
        run: npm run lint

      - name: Generate JaCoCo report
        run: mvn -B jacoco:report -Dmaven.repo.local=$HOME/.m2

      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco